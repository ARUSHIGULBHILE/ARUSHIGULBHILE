<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">AG Data Terminal</title>
  <desc id="desc">A terminal-themed introduction to Arushi Gulbhile and her data analytics focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55E6CF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#173044" stroke-width="0.7" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="#284154"/>
  <path d="M1 53H999" stroke="#284154"/>
  <circle cx="28" cy="27" r="6" fill="#FF6B6B"/>
  <circle cx="49" cy="27" r="6" fill="#FBBF24"/>
  <circle cx="70" cy="27" r="6" fill="#55E6CF"/>
  <text x="96" y="32" fill="#9FB4C8" font-family="monospace" font-size="14">ag@data-terminal: ~</text>
  <text x="42" y="94" fill="#55E6CF" font-family="monospace" font-size="19">$ whoami</text>
  <text x="42" y="130" fill="#F1F5F9" font-family="monospace" font-size="28" font-weight="700">ARUSHI GULBHILE</text>
  <text x="42" y="165" fill="#9FB4C8" font-family="monospace" font-size="17">Aspiring Data Analyst</text>
  <text x="42" y="207" fill="#55E6CF" font-family="monospace" font-size="17">$ stack --show</text>
  <text x="42" y="237" fill="#D5E4EF" font-family="monospace" font-size="16">Python  /  SQL  /  Power BI  /  Excel</text>
  <text x="42" y="271" fill="#8B5CF6" font-family="monospace" font-size="16">$ turn_data_into_insight<tspan fill="#55E6CF">_</tspan>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <g transform="translate(720 92)" opacity="0.95">
    <path d="M0 132H220" stroke="#284154"/>
    <rect x="12" y="68" width="24" height="64" rx="3" fill="#0EA5A4" opacity="0.85"/>
    <rect x="49" y="40" width="24" height="92" rx="3" fill="#14B8A6" opacity="0.8"/>
    <rect x="86" y="15" width="24" height="117" rx="3" fill="#6366F1" opacity="0.9"/>
    <rect x="123" y="53" width="24" height="79" rx="3" fill="#8B5CF6" opacity="0.85"/>
    <rect x="160" y="28" width="24" height="104" rx="3" fill="#22D3EE" opacity="0.75"/>
    <path d="M0 58L42 47L79 60L116 22L153 34L194 4" fill="none" stroke="url(#line)" stroke-width="3"/>
    <circle cx="194" cy="4" r="5" fill="#55E6CF"/>
    <text x="0" y="-8" fill="#9FB4C8" font-family="monospace" font-size="13">ANALYTICS MODULE</text>
  </g>
</svg>
